<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoonCore-Cloud</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #00d4ff;
      --primary-dark: #0099cc;
      --secondary: #ff006e;
      --bg: #0a0a0a;
      --surface: #1a1a2e;
      --surface-light: #16213e;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --border: rgba(0, 212, 255, 0.2);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1a3f 100%);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav {
      display: flex;
      gap: 30px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--primary);
      color: var(--bg);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    }

    /* Main Content */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Section Title */
    .section-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text);
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 30px;
      background: var(--primary);
      margin-right: 15px;
      border-radius: 3px;
    }

    /* Search Bar */
    .search-wrap {
      margin-bottom: 40px;
    }

    .search-bar {
      width: 100%;
      padding: 16px 20px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .game-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
    }

    .game-poster {
      width: 100%;
      height: 350px;
      object-fit: cover;
      background: linear-gradient(45deg, var(--surface-light), var(--surface));
    }

    .game-info {
      padding: 20px;
    }

    .game-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .game-dev {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .game-tag {
      font-size: 10px;
      background: rgba(0, 212, 255, 0.1);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .play-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .play-btn:hover {
      background: var(--primary-dark);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      transform: scale(1.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      color: var(--primary);
      transform: rotate(90deg);
    }

    .modal-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 30px;
      border: 2px solid var(--border);
    }

    .modal-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--text);
    }

    .modal-dev {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-desc {
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .modal-specs {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .spec-label {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .spec-value {
      color: var(--primary);
      font-weight: 600;
    }

    .modal-play {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .modal-play:hover {
      background: var(--primary-dark);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
      transform: scale(1.05);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state-title {
      font-size: 24px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .empty-state-desc {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--primary);
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }

      .logo {
        font-size: 22px;
      }

      .nav {
        gap: 10px;
      }

      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }

      .container {
        padding: 20px 15px;
      }

      .section-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">🎮 GOONCORE-CLOUD</div>
    <div class="nav">
      <button class="nav-btn active" onclick="switchSection('browse')">Browse</button>
      <button class="nav-btn" onclick="switchSection('search')">Search</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Browse Section -->
    <div id="browse" class="section active">
      <h1 class="section-title">Featured Games</h1>
      <div id="browse-grid" class="games-grid"></div>
    </div>

    <!-- Search Section -->
    <div id="search" class="section">
      <h1 class="section-title">Search Games</h1>
      <div class="search-wrap">
        <input 
          type="text" 
          class="search-bar" 
          id="search-input" 
          placeholder="Search by game name, developer, or tag..."
          oninput="handleSearch()"
        >
      </div>
      <div id="search-grid" class="games-grid"></div>
    </div>
  </div>

  <!-- Game Details Modal -->
  <div id="gameModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <img id="modalImage" class="modal-image" src="" alt="">
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalDev" class="modal-dev"></p>
      <p id="modalDesc" class="modal-desc"></p>
      
      <div class="modal-specs">
        <div class="spec-row">
          <span class="spec-label">Min OS</span>
          <span id="minOs" class="spec-value"></span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Min CPU</span>
          <span id="minCpu" class="spec-value"></span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Min RAM</span>
          <span id="minRam" class="spec-value"></span>
        </div>
        <div class="spec-row">
          <span class="spec-label">Min GPU</span>
          <span id="minGpu" class="spec-value"></span>
        </div>
      </div>

      <button class="modal-play" onclick="playGame()">Play Now</button>
    </div>
  </div>

  <script src="random/gamelayout.js"></script>
  <script>
    let selectedGame = null;

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      console.log('Page loaded. G_DATA length:', typeof G_DATA !== 'undefined' ? G_DATA.length : 'undefined');
      loadBrowseGames();
    });

    // Load browse games
    function loadBrowseGames() {
      if (typeof G_DATA === 'undefined' || !G_DATA || G_DATA.length === 0) {
        document.getElementById('browse-grid').innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-state-title">⚠️ No Games Found</div>
            <div class="empty-state-desc">Failed to load games. Please refresh the page.</div>
          </div>
        `;
        return;
      }

      const grid = document.getElementById('browse-grid');
      grid.innerHTML = '';

      G_DATA.forEach((game, index) => {
        const card = createGameCard(game);
        grid.appendChild(card);
      });
    }

    // Create game card
    function createGameCard(game) {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <img src="${game.img}" alt="${game.n}" class="game-poster" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22350%22%3E%3Crect fill=%22%231a1a2e%22 width=%22280%22 height=%22350%22/%3E%3C/svg%3E'">
        <div class="game-info">
          <div class="game-title">${game.n}</div>
          <div class="game-dev">${game.dev}</div>
          <div class="game-tags">
            ${game.tags.slice(0, 2).map(tag => `<span class="game-tag">${tag}</span>`).join('')}
          </div>
          <button class="play-btn" onclick="openGameModal('${game.id}')">Learn More</button>
        </div>
      `;
      return card;
    }

    // Switch sections
    function switchSection(section) {
      // Update active nav button
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Hide all sections
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

      // Show selected section
      document.getElementById(section).classList.add('active');
    }

    // Open game modal
    function openGameModal(gameId) {
      const game = G_DATA.find(g => g.id === gameId);
      if (!game) return;

      selectedGame = game;
      
      document.getElementById('modalImage').src = game.bg;
      document.getElementById('modalTitle').textContent = game.n;
      document.getElementById('modalDev').textContent = game.dev;
      document.getElementById('modalDesc').textContent = game.desc;
      document.getElementById('minOs').textContent = game.rm.os;
      document.getElementById('minCpu').textContent = game.rm.cpu;
      document.getElementById('minRam').textContent = game.rm.ram;
      document.getElementById('minGpu').textContent = game.rm.gpu;

      document.getElementById('gameModal').classList.add('active');
    }

    // Close modal
    function closeModal() {
      document.getElementById('gameModal').classList.remove('active');
      selectedGame = null;
    }

    // Play game
    function playGame() {
      if (selectedGame) {
        window.open(selectedGame.url, '_blank');
      }
    }

    // Handle search
    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('search-grid');

      if (!query) {
        grid.innerHTML = '';
        return;
      }

      const results = G_DATA.filter(game => 
        game.n.toLowerCase().includes(query) ||
        game.dev.toLowerCase().includes(query) ||
        game.tags.some(tag => tag.toLowerCase().includes(query))
      );

      grid.innerHTML = '';

      if (results.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-state-title">No Results Found</div>
            <div class="empty-state-desc">Try searching for a different game, developer, or genre.</div>
          </div>
        `;
        return;
      }

      results.forEach(game => {
        grid.appendChild(createGameCard(game));
      });
    }

    // Close modal when clicking outside
    document.getElementById('gameModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'gameModal') {
        closeModal();
      }
    });
  </script>
</body>
</html>
